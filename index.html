<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>多采多姿頭皮管理｜線上預約</title>
  <link rel="stylesheet" href="./style.css?v=2.2">
</head>
<body>
  <main class="app-shell">
    <header class="brand">
      <div>
        <p class="eyebrow">ONLINE BOOKING</p>
        <h1 id="appName">多采多姿頭皮管理－土城店</h1>
        <p class="muted">LINE MINI App 線上預約</p>
      </div>
      <div id="identityBadge" class="identity-badge">連線中</div>
    </header>

    <div id="globalMsg" class="notice hidden" aria-live="polite"></div>

    <section id="profileCard" class="profile-card hidden">
      <div class="avatar" id="avatar">客</div>
      <div class="profile-copy">
        <strong id="hello">您好</strong>
        <span id="bindingText">正在讀取會員資料</span>
      </div>
    </section>

    <nav class="tabs" aria-label="預約功能">
      <button id="tabBook" class="tab active" type="button">我要預約</button>
      <button id="tabMine" class="tab" type="button">我的預約</button>
    </nav>

    <section id="bookPage">
      <section class="card">
        <div class="step">STEP 1</div>
        <h2>選擇日期</h2>
        <div class="date-control"><input id="dateInput" type="date"></div>
        <p class="hint">只會顯示當天實際可提供服務的課程。</p>
      </section>

      <section id="courseCard" class="card hidden">
        <div class="step">STEP 2</div>
        <h2>選擇課程</h2>
        <div id="courseList" class="course-list"></div>
      </section>

      <section id="slotCard" class="card hidden">
        <div class="step">STEP 3</div>
        <h2>選擇時間</h2>
        <div id="slotList" class="slot-grid"></div>
        <p class="hint">老師由系統依能力、排班與時段自動安排。</p>
      </section>

      <section id="contactCard" class="card hidden">
        <div class="step">STEP 4</div>
        <h2>預約資料</h2>
        <label for="nameInput">姓名</label>
        <input id="nameInput" type="text" autocomplete="name" placeholder="請輸入姓名">
        <label for="phoneInput">手機</label>
        <input id="phoneInput" type="tel" inputmode="numeric" autocomplete="tel" placeholder="09xxxxxxxx">
        <label for="noteInput">備註 <span class="muted">（選填）</span></label>
        <textarea id="noteInput" placeholder="例如：第一次來店、需特別留意事項"></textarea>
        <p class="member-note">首次預約送出時會自動建立會員編號，之後預約、購課與消課都會沿用同一個會員資料。</p>
      </section>

      <section id="confirmCard" class="card hidden">
        <div class="step">STEP 5</div>
        <h2>確認預約</h2>
        <div id="bookingSummary" class="summary"></div>
        <button id="bookBtn" class="primary-btn" type="button">確認送出預約</button>
      </section>
    </section>

    <section id="minePage" class="hidden">
      <section class="card">
        <div class="section-head">
          <div>
            <p class="step">BOOKINGS</p>
            <h2>我的預約</h2>
          </div>
          <button id="refreshMineBtn" class="mini-btn" type="button">重新整理</button>
        </div>
        <div id="mineList" class="loading">載入中…</div>
      </section>
    </section>

    <details class="debug-card">
      <summary>技術資訊</summary>
      <pre id="debugOutput">尚未初始化</pre>
    </details>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./config.js?v=2.2"></script>
  <script src="./app.js?v=2.2"></script>
</body>
</html>
